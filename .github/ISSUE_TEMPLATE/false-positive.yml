name: False positive
description: Report legitimate code that Codebase Guard flags
title: "[False positive]: "
labels: [false-positive]
body:
  - type: markdown
    attributes:
      value: Share only the smallest sanitized snippet needed to explain the pattern. Never post client code or secrets.
  - type: input
    id: version
    attributes:
      label: Codebase Guard version
      placeholder: 0.1.7
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: FG-VSCODE-AUTOTASK
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Reported severity
      options:
        - Critical
        - High
        - Review
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: File type or safe relative path
      placeholder: .vscode/tasks.json or JavaScript config
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why is this legitimate?
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal sanitized example
      render: text
  - type: checkboxes
    id: safe
    attributes:
      label: Data safety
      options:
        - label: I removed credentials, personal information, absolute paths, and proprietary code.
          required: true
