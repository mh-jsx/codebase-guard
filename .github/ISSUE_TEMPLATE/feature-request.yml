name: Feature request
description: Suggest a detection, UX, performance, or documentation improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the developer-safety problem rather than only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Static evidence and false-positive considerations
      description: For a scanner rule, describe signals that can be detected without running code.
  - type: checkboxes
    id: boundary
    attributes:
      label: Runtime boundary
      options:
        - label: This can work without executing workspace code, launching tools, or sending repository data over a network.
          required: true
