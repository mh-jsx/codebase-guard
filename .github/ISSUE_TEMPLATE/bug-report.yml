name: Bug report
description: Report a reproducible Codebase Guard problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, proprietary code, or unredacted findings. Report security vulnerabilities privately.
  - type: input
    id: version
    attributes:
      label: Codebase Guard version
      placeholder: 0.1.7
    validations:
      required: true
  - type: dropdown
    id: editor
    attributes:
      label: Editor
      options:
        - VS Code
        - Cursor
        - Other VS Code-compatible editor
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Windows 11, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use a minimal safe example and do not attach a live malicious payload.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional sanitized context
      description: Include relevant rule IDs or logs after removing sensitive data.
  - type: checkboxes
    id: safe
    attributes:
      label: Data safety
      options:
        - label: I removed credentials, personal information, absolute paths, and proprietary code.
          required: true
